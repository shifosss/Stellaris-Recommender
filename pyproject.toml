[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellaris-advisor"
version = "0.1.0"
description = "AI-powered strategy advisor for Stellaris"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Alex Zhang" },
]
dependencies = [
    "networkx>=3.0",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "d3rlpy>=2.0",
    "lightgbm>=4.0",
    "pyarrow>=14.0",
    "optuna>=3.0",
    "shap>=0.42",
    "scikit-learn>=1.3",
]
all = ["stellaris-advisor[ml]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
stellaris-advisor = "stellaris_advisor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stellaris_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no I/O",
    "integration: tests that parse real files",
    "slow: RL training and large save parsing",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["stellaris_advisor"]

[tool.coverage.report]
fail_under = 80
